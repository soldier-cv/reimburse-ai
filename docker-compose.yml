version: '3.8'

services:
  reimburse-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: reimburse-ai:${IMAGE_TAG:-latest}
    container_name: reimburse-ai
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:8090"
    environment:
      - PORT=8090
      # 首次部署无需预置密码，访问 Web 页面将自动弹出管理员初始化向导
      # 若需通过环境变量强制指定管理员默认账号密码，可取消注释下方配置：
      # - ADMIN_USERNAME=admin
      # - ADMIN_PASSWORD=YourStrongPassword!
      # - JWT_SECRET_KEY=your_custom_jwt_secret_here
    volumes:
      # 持久化 SQLite 数据库与系统设置
      - ./data:/app/data
      # 持久化原始发票与挂载的凭证附件
      - ./uploads:/app/uploads
