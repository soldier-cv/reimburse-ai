# Woodpecker CI - reimburse-ai (Woodpecker v3.19.0)
# 触发策略（仅 tag + manual，日常 push 不触发）：
#   1. tag: 推送 v* 标签（正式发版）
#   2. manual: Woodpecker 页面手动触发（可填 deploy_tag 变量指定版本标签，默认 latest）
# 链路：解析版本号并同步代码至宿主机目录 -> 本地构建镜像 -> docker compose 直接启动部署
when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

# 版本号解析：tag 事件用 CI_COMMIT_TAG；manual 用页面填的 deploy_tag 变量
skip_clone: false

steps:
  - name: resolve-tag
    image: alpine:3.20
    volumes:
      - /opt/code/reimburse-ai:/opt/code/reimburse-ai
    commands:
      # 确保持久化目录存在（保留已有 data 与 uploads 数据）
      - mkdir -p /opt/code/reimburse-ai/data /opt/code/reimburse-ai/uploads
      # 将当前检出的构建文件同步至宿主机部署目录
      - cp -rf app Dockerfile docker-compose.yml requirements.txt run.py /opt/code/reimburse-ai/
      # tag 事件用 CI_COMMIT_TAG；manual 用页面参数 deploy_tag（Deploy variables 填 deploy_tag=v1.x.y）
      - >-
        if [ -n "$${CI_COMMIT_TAG}" ]; then echo "$${CI_COMMIT_TAG}"; else echo "$${DEPLOY_TAG:-latest}"; fi | tr -d ' ' > /tmp/release_tag
      - echo "RELEASE_TAG=$$(cat /tmp/release_tag)"
      - cp /tmp/release_tag /opt/code/reimburse-ai/.release_tag
    environment:
      # manual 触发时可在页面 Deploy variables 填 deploy_tag=v1.x.y
      DEPLOY_TAG: ${DEPLOY_TAG}

  - name: build-and-deploy
    image: docker:26
    depends_on:
      - resolve-tag
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/code/reimburse-ai:/opt/code/reimburse-ai
    commands:
      - cd /opt/code/reimburse-ai
      - RELEASE_TAG=$$(cat /opt/code/reimburse-ai/.release_tag 2>/dev/null || echo $${CI_COMMIT_TAG:-latest}) && docker build -t "reimburse-ai:$${RELEASE_TAG}" -t "reimburse-ai:latest" .
      - RELEASE_TAG=$$(cat /opt/code/reimburse-ai/.release_tag 2>/dev/null || echo $${CI_COMMIT_TAG:-latest}) IMAGE_TAG="$${RELEASE_TAG}" docker compose up -d --force-recreate
      - docker compose ps
